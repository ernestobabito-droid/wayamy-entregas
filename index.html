<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#061A2D">

<title>WAYAMY ENTREGAS</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --navy:#061A2D;
    --dark:#08233B;
    --blue:#0F4C75;
    --blue2:#1B75BC;
    --light:#4DB6E8;
    --verylight:#EAF6FF;
    --white:#fff;
    --gray:#6B7C8F;
    --border:#D9E7F0;
    --green:#16A36A;
    --red:#D64545;
    --orange:#E98B2A;
    --shadow:0 8px 30px rgba(6,26,45,.10);
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#F4F8FB;
    color:#102A43;
}

/* =========================
   TEMA ESCURO
========================= */
body.dark-mode{
    background:#07111F;
    color:#E8F1F7;
}
body.dark-mode .topbar,
body.dark-mode .stat-card,
body.dark-mode .panel,
body.dark-mode .delivery-card,
body.dark-mode .modal-box{
    background:#0D1B2B;
    border-color:#21384B;
}
body.dark-mode .topbar{
    border-bottom-color:#21384B;
}
body.dark-mode .page-title h2,
body.dark-mode .page-header h1,
body.dark-mode .stat-card strong,
body.dark-mode .panel-header h3,
body.dark-mode .modal-header h3,
body.dark-mode .info-box h4{
    color:#EAF6FF;
}
body.dark-mode .page-header p,
body.dark-mode .stat-card span,
body.dark-mode .field label,
body.dark-mode .panel-body,
body.dark-mode .info-line,
body.dark-mode .login-extra{
    color:#AFC3D1;
}
body.dark-mode .field input,
body.dark-mode .field select,
body.dark-mode .field textarea{
    background:#081624;
    color:#EAF6FF;
    border-color:#2A4358;
}
body.dark-mode th{
    background:#102538;
    color:#BBD0DD;
}
body.dark-mode td{
    border-bottom-color:#21384B;
}
body.dark-mode tr:hover td{
    background:#102131;
}
body.dark-mode .info-box{
    background:#0A1928;
    border-color:#21384B;
}
body.dark-mode .step{
    background:#142536;
    color:#AFC3D1;
}
body.dark-mode .btn-secondary,
body.dark-mode .notification-btn,
body.dark-mode .menu-toggle{
    background:#153149;
    color:#DDF1FC;
}
body.dark-mode .close-modal{
    background:#172A3A;
    color:#EAF6FF;
}
body.dark-mode .modal-footer{
    border-top-color:#21384B;
}
body.dark-mode .modal-header{
    border-bottom-color:#21384B;
}


button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   LOGIN
========================= */

#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#061A2D,#0F4C75);
    padding:20px;
}

.login-box{
    width:100%;
    max-width:430px;
    background:#fff;
    border-radius:22px;
    padding:30px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.logo{
    width:70px;
    height:70px;
    border-radius:18px;
    background:linear-gradient(135deg,#0F4C75,#1B75BC);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:900;
    margin:0 auto 15px;
}

.login-box h1{
    text-align:center;
    color:var(--navy);
    font-size:27px;
}

.login-box .subtitle{
    text-align:center;
    color:var(--gray);
    margin:7px 0 25px;
}

.role-tabs{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-bottom:20px;
}

.role-tab{
    border:1px solid var(--border);
    background:#F5FAFD;
    padding:11px 5px;
    border-radius:10px;
    color:var(--blue);
    font-weight:bold;
}

.role-tab.active{
    background:var(--blue);
    color:#fff;
}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
    color:#345;
}

.field input,
.field select,
.field textarea{
    width:100%;
    border:1px solid #CBDCE7;
    border-radius:10px;
    padding:12px;
    outline:none;
    background:#fff;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
    border-color:var(--blue2);
    box-shadow:0 0 0 3px rgba(27,117,188,.10);
}

textarea{
    min-height:90px;
    resize:vertical;
}

.btn{
    border:0;
    border-radius:10px;
    padding:12px 16px;
    font-weight:bold;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn-primary{
    background:var(--blue);
    color:#fff;
}

.btn-primary:hover{
    background:var(--blue2);
}

.btn-secondary{
    background:#EAF6FF;
    color:var(--blue);
}

.btn-success{
    background:var(--green);
    color:#fff;
}

.btn-danger{
    background:var(--red);
    color:#fff;
}

.btn-warning{
    background:var(--orange);
    color:#fff;
}

.btn-full{
    width:100%;
}

.login-extra{
    text-align:center;
    margin-top:18px;
    color:var(--gray);
    font-size:13px;
}

.login-extra button{
    background:none;
    border:0;
    color:var(--blue2);
    font-weight:bold;
}

/* =========================
   APP
========================= */

#app{
    display:none;
    min-height:100vh;
}

.app-layout{
    min-height:100vh;
    display:flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:265px;
    background:var(--navy);
    color:#fff;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    z-index:1000;
    display:flex;
    flex-direction:column;
    transition:transform .25s ease;
}

.sidebar-header{
    padding:22px 18px;
    border-bottom:1px solid rgba(255,255,255,.10);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand .logo-small{
    width:42px;
    height:42px;
    border-radius:12px;
    background:var(--blue2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
}

.brand strong{
    display:block;
    font-size:16px;
}

.brand small{
    color:#AFC8D9;
}

.sidebar-menu{
    flex:1;
    overflow-y:auto;
    padding:12px;
}

.menu-section{
    color:#78A4C1;
    font-size:11px;
    text-transform:uppercase;
    font-weight:bold;
    padding:12px 10px 6px;
}

.menu-item{
    width:100%;
    border:0;
    background:transparent;
    color:#DDEBF4;
    display:flex;
    align-items:center;
    gap:11px;
    padding:12px 13px;
    border-radius:10px;
    margin-bottom:3px;
    text-align:left;
}

.menu-item:hover{
    background:rgba(255,255,255,.08);
}

.menu-item.active{
    background:var(--blue);
    color:#fff;
}

.menu-icon{
    width:24px;
    text-align:center;
}

.sidebar-footer{
    padding:14px;
    border-top:1px solid rgba(255,255,255,.10);
}

.user-mini{
    padding:10px;
    border-radius:10px;
    background:rgba(255,255,255,.06);
    margin-bottom:9px;
}

.user-mini strong{
    display:block;
    font-size:13px;
}

.user-mini span{
    color:#AFC8D9;
    font-size:11px;
}

.logout-btn{
    width:100%;
    border:1px solid rgba(255,255,255,.15);
    background:transparent;
    color:#fff;
    padding:10px;
    border-radius:9px;
}

/* =========================
   OVERLAY
========================= */

.menu-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:999;
}

.menu-overlay.show{
    display:block;
}

/* =========================
   MAIN
========================= */

.main{
    margin-left:265px;
    width:calc(100% - 265px);
    min-height:100vh;
}

.topbar{
    height:68px;
    background:#fff;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    position:sticky;
    top:0;
    z-index:500;
}

.topbar-left{
    display:flex;
    align-items:center;
    gap:13px;
}

.menu-toggle{
    display:none;
    border:0;
    background:#EAF6FF;
    color:var(--blue);
    width:42px;
    height:42px;
    border-radius:10px;
    font-size:21px;
}

.page-title h2{
    font-size:20px;
    color:var(--navy);
}

.page-title small{
    color:var(--gray);
}

.top-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.notification-btn{
    border:0;
    background:#EAF6FF;
    color:var(--blue);
    width:42px;
    height:42px;
    border-radius:10px;
    position:relative;
}

.notification-count{
    position:absolute;
    top:-3px;
    right:-3px;
    background:var(--red);
    color:#fff;
    width:18px;
    height:18px;
    border-radius:50%;
    font-size:10px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.status-pill{
    padding:7px 11px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}

.status-active{
    background:#DFF7EC;
    color:#087A4D;
}

.status-inactive{
    background:#FDE5E5;
    color:#A92828;
}

.content{
    padding:25px;
    max-width:1500px;
    margin:auto;
}

/* =========================
   PAGES
========================= */

.app-page{
    display:none;
}

.app-page.active{
    display:block;
}

.page-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.page-header h1{
    font-size:24px;
    color:var(--navy);
}

.page-header p{
    color:var(--gray);
    margin-top:4px;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

/* =========================
   CARDS
========================= */

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:22px;
}

.stat-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:15px;
    padding:18px;
    box-shadow:var(--shadow);
}

.stat-card .stat-icon{
    width:42px;
    height:42px;
    background:#EAF6FF;
    color:var(--blue);
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    margin-bottom:13px;
}

.stat-card strong{
    display:block;
    font-size:25px;
    color:var(--navy);
}

.stat-card span{
    color:var(--gray);
    font-size:12px;
}

.panel{
    background:#fff;
    border:1px solid var(--border);
    border-radius:15px;
    box-shadow:var(--shadow);
    margin-bottom:20px;
}

.panel-header{
    padding:16px 18px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.panel-header h3{
    color:var(--navy);
    font-size:16px;
}

.panel-body{
    padding:18px;
}

.grid-2{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.grid-3{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.form-grid .full{
    grid-column:1/-1;
}

/* =========================
   TABLE
========================= */

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

th,
td{
    padding:12px;
    border-bottom:1px solid #E6EEF3;
    text-align:left;
    font-size:13px;
}

th{
    background:#F5FAFD;
    color:#496477;
    font-size:11px;
    text-transform:uppercase;
}

tr:hover td{
    background:#FAFCFE;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:10px;
    font-weight:bold;
}

.badge-blue{
    background:#E2F1FC;
    color:#0F5F95;
}

.badge-green{
    background:#DFF7EC;
    color:#087A4D;
}

.badge-orange{
    background:#FFF0DE;
    color:#A75A08;
}

.badge-red{
    background:#FDE5E5;
    color:#A92828;
}

.empty{
    text-align:center;
    padding:35px;
    color:var(--gray);
}

/* =========================
   DELIVERY
========================= */

.delivery-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:14px;
    padding:17px;
    margin-bottom:12px;
}

.delivery-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:15px;
}

.delivery-id{
    color:var(--blue);
    font-weight:bold;
}

.delivery-sections{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.info-box{
    background:#F7FBFD;
    border:1px solid #E1EDF3;
    border-radius:10px;
    padding:12px;
}

.info-box h4{
    font-size:12px;
    color:var(--blue);
    margin-bottom:8px;
}

.info-line{
    font-size:12px;
    margin:5px 0;
}

.info-line strong{
    color:#29475D;
}

.call-btn{
    display:inline-flex;
    align-items:center;
    gap:5px;
    border:0;
    background:#DFF7EC;
    color:#087A4D;
    padding:8px 10px;
    border-radius:8px;
    font-size:11px;
    font-weight:bold;
    text-decoration:none;
    margin-top:7px;
}

/* =========================
   STEPS
========================= */

.steps{
    display:flex;
    gap:5px;
    overflow-x:auto;
    margin:15px 0;
}

.step{
    min-width:125px;
    padding:10px;
    border-radius:9px;
    background:#EEF4F8;
    color:#708394;
    font-size:11px;
    text-align:center;
}

.step.done{
    background:#DFF7EC;
    color:#087A4D;
}

.step.current{
    background:#E2F1FC;
    color:#0F5F95;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(3,17,29,.55);
    z-index:2000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:650px;
    max-height:90vh;
    overflow-y:auto;
    background:#fff;
    border-radius:17px;
    box-shadow:0 20px 70px rgba(0,0,0,.25);
}

.modal-header{
    padding:17px 20px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-header h3{
    color:var(--navy);
}

.close-modal{
    border:0;
    background:#F1F5F8;
    width:35px;
    height:35px;
    border-radius:8px;
    font-size:18px;
}

.modal-body{
    padding:20px;
}

.modal-footer{
    padding:15px 20px;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:flex-end;
    gap:8px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:var(--navy);
    color:#fff;
    padding:13px 17px;
    border-radius:10px;
    z-index:3000;
    box-shadow:var(--shadow);
    transform:translateY(100px);
    opacity:0;
    transition:.25s;
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

/* =========================
   GESTOR - ORGANIZAÇÃO PROFISSIONAL
========================= */
.dashboard-hero{
    background:linear-gradient(135deg,#061A2D,#0F4C75);
    color:#fff;
    border-radius:18px;
    padding:22px;
    margin-bottom:18px;
    box-shadow:0 12px 35px rgba(6,26,45,.18);
}
.dashboard-hero h1{font-size:25px;margin-bottom:6px}
.dashboard-hero p{color:#D7E8F3;font-size:13px}
.dashboard-section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}
.dashboard-section-title h3{font-size:16px;color:var(--navy)}
.dashboard-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.dashboard-op{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.dashboard-op-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dashboard-op strong{font-size:22px;color:var(--navy)}
.dashboard-op small{color:var(--gray)}
.invoice-actions{display:flex;gap:7px;flex-wrap:wrap}
.invoice-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.invoice-mini{background:#F7FBFD;border:1px solid #E1EDF3;border-radius:10px;padding:12px}
.invoice-mini span{display:block;color:var(--gray);font-size:10px;text-transform:uppercase;margin-bottom:5px}
.invoice-mini strong{font-size:13px;color:var(--navy)}
.invoice-block{border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden}
.invoice-block h4{background:#F5FAFD;padding:11px 13px;color:var(--blue);font-size:12px}
.invoice-block .invoice-block-body{padding:13px}
.invoice-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;margin:6px 0}
.invoice-history{border-left:2px solid #D9E7F0;margin:10px 0 0 7px;padding-left:14px}
.invoice-history-item{position:relative;margin-bottom:12px;font-size:12px}
.invoice-history-item:before{content:"";position:absolute;left:-20px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--blue2)}
@media(max-width:900px){.dashboard-grid{grid-template-columns:1fr 1fr}.invoice-summary{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.dashboard-grid{grid-template-columns:1fr}.invoice-summary{grid-template-columns:1fr 1fr}.invoice-row{grid-template-columns:1fr}}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1100px){
    .cards{
        grid-template-columns:repeat(2,1fr);
    }

    .grid-3{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:850px){

    .sidebar{
        transform:translateX(-100%);
        box-shadow:10px 0 30px rgba(0,0,0,.25);
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        margin-left:0;
        width:100%;
    }

    .menu-toggle{
        display:block;
    }

    .topbar{
        padding:0 14px;
    }

    .content{
        padding:15px;
    }

    .top-actions .status-pill{
        display:none;
    }

    .grid-2,
    .form-grid{
        grid-template-columns:1fr;
    }

    .delivery-sections{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){

    .cards{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .stat-card{
        padding:13px;
    }

    .stat-card strong{
        font-size:21px;
    }

    .page-header{
        align-items:flex-start;
        flex-direction:column;
    }

    .grid-3{
        grid-template-columns:1fr;
    }

    .topbar{
        height:62px;
    }

    .page-title h2{
        font-size:16px;
    }

    .login-box{
        padding:22px;
    }
}

/* ===== WAYAMY CUSTOMIZAÇÕES ===== */
body::before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,.22)),url("fundo.png") center/cover no-repeat;z-index:-2;pointer-events:none}
body.dark-mode::before{background:linear-gradient(rgba(5,15,27,.42),rgba(5,15,27,.50)),url("fundo.png") center/cover no-repeat}
.login-logo-img{width:82px;height:82px;object-fit:contain;display:block;margin:0 auto 15px;border-radius:18px}
.brand-logo-img{width:44px;height:44px;object-fit:contain;border-radius:10px}
.brand-logo-img.small{width:42px;height:42px}
.security-note{font-size:12px;color:#718;margin:0 0 14px}
.invoice-actions{display:flex;gap:6px;flex-wrap:wrap}
@media(max-width:600px){
 .table-wrap{overflow:visible!important}
 .table-wrap table,.table-wrap thead,.table-wrap tbody,.table-wrap tr,.table-wrap td{display:block!important;width:100%!important}
 .table-wrap thead{display:none!important}
 .table-wrap tr{margin:0 0 12px;border:1px solid var(--border);border-radius:12px;padding:6px;background:var(--panel,#fff)}

<script>

/* =========================================================
   DATABASE LOCAL
========================================================= */

const STORAGE = {
    users:"wayamy_users",
    deliveries:"wayamy_deliveries",
    notifications:"wayamy_notifications",
    routes:"wayamy_routes",
    settings:"wayamy_settings",
    session:"wayamy_session"
};

function getData(key, fallback=[]){
    try{
        return JSON.parse(localStorage.getItem(key)) ?? fallback;
    }catch{
        return fallback;
    }
}

function saveData(key,data){
    localStorage.setItem(key,JSON.stringify(data));
}


/* =========================================================
   CONFIGURAÇÃO INICIAL
========================================================= */

function initializeData(){

    if(!localStorage.getItem(STORAGE.users)){
        // Contas reais são criadas pelo utilizador. Nenhuma conta de demonstração é criada.
        saveData(STORAGE.users,[]);
    }

    // Limpeza definitiva de contas/registos de demonstração de versões anteriores.
    // Preserva contas reais criadas pelo utilizador.
    const demoUserIds=["CLI-001","MOT-001"];
    const demoUserNames=["Cliente Demo","Motoboy Demo"];
    const demoUserEmails=["cliente@wayamy.com","motoboy@wayamy.com"];
    const usersBeforeCleanup=getData(STORAGE.users,[]);
    const usersAfterCleanup=usersBeforeCleanup.filter(u=>
        !demoUserIds.includes(u.id) &&
        !demoUserNames.includes(u.name) &&
        !demoUserEmails.includes(u.email)
    );
    if(usersAfterCleanup.length!==usersBeforeCleanup.length){
        saveData(STORAGE.users,usersAfterCleanup);
    }

    const deliveriesBeforeCleanup=getData(STORAGE.deliveries,[]);
    const deliveriesAfterCleanup=deliveriesBeforeCleanup.filter(d=>{
        const text=JSON.stringify(d||{}).toLowerCase();
        return !text.includes("cliente demo") &&
               !text.includes("motoboy demo") &&
               !text.includes("cli-001") &&
               !text.includes("mot-001") &&
               !text.includes("cliente@wayamy.com") &&
               !text.includes("motoboy@wayamy.com");
    });
    if(deliveriesAfterCleanup.length!==deliveriesBeforeCleanup.length){
        saveData(STORAGE.deliveries,deliveriesAfterCleanup);
    }

    const notificationsBeforeCleanup=getData(STORAGE.notifications,[]);
    const notificationsAfterCleanup=notificationsBeforeCleanup.filter(n=>{
        const text=JSON.stringify(n||{}).toLowerCase();
        return !text.includes("cliente demo") &&
               !text.includes("motoboy demo") &&
               !text.includes("cli-001") &&
               !text.includes("mot-001") &&
               !text.includes("cliente@wayamy.com") &&
               !text.includes("motoboy@wayamy.com");
    });
    if(notificationsAfterCleanup.length!==notificationsBeforeCleanup.length){
        saveData(STORAGE.notifications,notificationsAfterCleanup);
    }

    // Se a sessão antiga pertencia a uma conta de demonstração, termina-a.
    try{
        const oldSession=JSON.parse(localStorage.getItem(STORAGE.session)||"null");
        if(oldSession && (
            demoUserIds.includes(oldSession.id) ||
            demoUserNames.includes(oldSession.name) ||
            demoUserEmails.includes(oldSession.email)
        )){
            localStorage.removeItem(STORAGE.session);
        }
    }catch{}

    if(!localStorage.getItem(STORAGE.routes)){
        // As rotas são criadas pelo Gestor. Não são inseridas rotas de exemplo.
        saveData(STORAGE.routes,[]);
    }

    // Remover rotas de demonstração de versões anteriores.
    const oldDemoRoutes=["ROT-001","ROT-002","ROT-003","ROT-004"];
    const existingRoutes=getData(STORAGE.routes,[]);
    const cleanedRoutes=existingRoutes.filter(r=>!oldDemoRoutes.includes(r.id));
    if(cleanedRoutes.length!==existingRoutes.length){
        saveData(STORAGE.routes,cleanedRoutes);
    }

    if(!localStorage.getItem(STORAGE.settings)){

        saveData(STORAGE.settings,{
            paymentMethod:"mcx",

            iban:{
                holder:"WAYAMY ENTREGAS",
                bank:"",
                iban:"",
                account:"",
                instructions:""
            },

            multicaixa:{
                name:"WAYAMY ENTREGAS",
                number:"",
                instructions:""
            },

            proofWhatsapp:"923000000",
            orderWhatsapp:"923000000",

            driverPercent:75,
            companyPercent:25,

            theme:"light",

        });

    }

    if(!localStorage.getItem(STORAGE.deliveries)){
        saveData(STORAGE.deliveries,[]);
    }

    if(!localStorage.getItem(STORAGE.notifications)){
        saveData(STORAGE.notifications,[]);
    }

    /* Compatibilidade com versões anteriores */
    const currentSettings=getData(STORAGE.settings,{});
    let settingsChanged=false;

    if(!currentSettings.theme){
        currentSettings.theme="light";
        settingsChanged=true;
    }

    if(!currentSettings.proofWhatsapp){
        currentSettings.proofWhatsapp="923000000";
        settingsChanged=true;
    }

    if(!currentSettings.orderWhatsapp){
        currentSettings.orderWhatsapp=currentSettings.proofWhatsapp||"923000000";
        settingsChanged=true;
    }

    if(typeof currentSettings.driverPercent!=="number") {
        currentSettings.driverPercent=75;
        settingsChanged=true;
    }
    if(typeof currentSettings.companyPercent!=="number") {
        currentSettings.companyPercent=100-currentSettings.driverPercent;
        settingsChanged=true;
    }

    if(settingsChanged){
        saveData(STORAGE.settings,currentSettings);
    }

}

initializeData();


/* =========================================================
   TEMA
========================================================= */

function applyTheme(){
    const settings=getData(STORAGE.settings,{theme:"light"});
    const dark=settings.theme==="dark";

    document.body.classList.toggle("dark-mode",dark);

    const meta=document.querySelector('meta[name="theme-color"]');
    if(meta){
        meta.setAttribute("content",dark?"#07111F":"#061A2D");
    }
    const topBtn=document.getElementById("topThemeBtn");
    const floatBtn=document.getElementById("themeFloatingBtn");
    const title=dark?"Mudar para modo claro":"Mudar para modo escuro";
    if(topBtn){
        topBtn.textContent=dark?"☀️":"🌙";
        topBtn.title=title;
        topBtn.setAttribute("aria-label",title);
    }
    if(floatBtn){
        floatBtn.textContent=dark?"☀️":"🌙";
        floatBtn.title=title;
        floatBtn.setAttribute("aria-label",title);
    }
}

function toggleTheme(){
    const settings=getData(STORAGE.settings,{});
    settings.theme=settings.theme==="dark"?"light":"dark";
    saveData(STORAGE.settings,settings);
    applyTheme();

    if(session){
        renderPage(currentPage || currentRolePage(
            session.role==="manager"?"dashboard":"home"
        ));
    }

    toast(
        settings.theme==="dark"
        ?"Modo escuro ativado."
        :"Modo claro ativado."
    );
}

applyTheme();

/* =========================================================
   ESTADO
========================================================= */

let session = null;
let selectedRole = "client";
let currentPage = null;


/* =========================================================
   MENU
========================================================= */

function toggleMenu(){

    const menu = document.getElementById("sideMenu");

    if(menu.classList.contains("open")){
        closeMenu();
    }else{
        openMenu();
    }
}

function openMenu(){

    document.getElementById("sideMenu").classList.add("open");
    document.getElementById("menuOverlay").classList.add("show");

}

function closeMenu(){

    document.getElementById("sideMenu").classList.remove("open");
    document.getElementById("menuOverlay").classList.remove("show");

}

document.getElementById("menuOverlay").addEventListener(
    "click",
    closeMenu
);

document.addEventListener("keydown",function(e){

    if(e.key==="Escape"){
        closeMenu();
    }

});


/* =========================================================
   NAVEGAÇÃO CENTRAL
========================================================= */

function navigate(page,fromHistory=false){
    if(!page) return;
    currentPage = page;
    if(!fromHistory && session){
        try{ history.pushState({wayamy:true,page:page,role:session.role},"","#"+page); }catch(e){}
    }

    // fecha sempre o menu
    closeMenu();

    renderPage(page);

    // garante que a página começa no topo
    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


window.addEventListener("popstate",function(e){
    if(!session) return;
    const modal=document.getElementById("modal");
    if(modal && modal.classList.contains("show")){ closeModal(); history.pushState({wayamy:true,page:currentPage,role:session.role},"","#"+currentPage); return; }
    const state=e.state;
    if(state && state.wayamy && state.role===session.role && state.page){ renderPage(state.page); currentPage=state.page; window.scrollTo(0,0); }
    else { history.pushState({wayamy:true,page:currentPage,role:session.role},"","#"+currentPage); }
});

/* =========================================================
   PÁGINAS POR FUNÇÃO
========================================================= */

function currentRolePage(name){

    return session?.role + "-" + name;

}


/* =========================================================
   MENUS
========================================================= */

const managerMenu = [

    ["dashboard","📊","Dashboard"],

/* =========================================================
   RENDER
========================================================= */

function renderPage(page){

    const parts=page.split("-");
    const role=parts.shift();
    const screen=parts.join("-");

    let html="";

    if(role==="manager"){
        html=renderManager(screen);
    }

    if(role==="client"){
        html=renderClient(screen);
    }

    if(role==="driver"){
        html=renderDriver(screen);
    }

    document.getElementById("content").innerHTML=html;
    document.querySelectorAll(".table-wrap table").forEach(table=>{
        const headers=[...table.querySelectorAll("thead th")].map(th=>th.textContent.trim());
        table.querySelectorAll("tbody tr").forEach(row=>{
            [...row.children].forEach((cell,i)=>{ if(headers[i]) cell.setAttribute("data-label",headers[i]); });
        });
    });

    document.getElementById("topTitle").textContent=
        titles[screen]?.[0] || "WAYAMY ENTREGAS";

    document.getElementById("topSubtitle").textContent=
        titles[screen]?.[1] || "";

    document.querySelectorAll(".menu-item").forEach(item=>{
        item.classList.toggle(
            "active",
            item.dataset.page===page
        );
    });

    updateNotificationCount();

}

        case "drivers":

    const drivers=users.filter(u=>u.role==="driver");

    const active=deliveries.filter(d=>!["completed","cancelled"].includes(d.status)).length;

            <div class="stat-card"><div class="stat-icon">💰</div><strong>${money(revenue)}</strong><span>Pagamentos confirmados</span></div>
        </div>

        <div class="dashboard-section-title"><h3>Valores acumulados</h3></div>
        <div class="cards">
            <div class="stat-card"><div class="stat-icon">🏍️</div><strong>${money(driverCash)}</strong><span>Cash Motoboys (${driverPercent}%)</span></div>
            <div class="stat-card"><div class="stat-icon">🏢</div><strong>${money(companyCash)}</strong><span>Cash Empresa (${companyPercent}%)</span></div>
        </div>

        <div class="dashboard-grid">
            <div class="dashboard-op"><div class="dashboard-op-head"><strong>${onlineDrivers}</strong><span>🟢</span></div><small>Motoboys online</small><br><button class="btn btn-secondary" style="margin-top:12px" onclick="navigate('manager-drivers')">Ver motoboys</button></div>

function removeClientAccount(id){
    const users=getData(STORAGE.users);
    const user=users.find(u=>u.id===id && u.role==="client");
    if(!user) return;
    if(!confirm(`Eliminar definitivamente a conta de ${user.name||"este cliente"}? O histórico das entregas será preservado.`)) return;

    const deliveries=getData(STORAGE.deliveries);
    deliveries.forEach(d=>{
        if(d.clientId===id){
            d.clientName=d.clientName||user.name||"Cliente removido";
            d.clientPhone=d.clientPhone||user.phone||"";
            d.clientId=null;
        }
    });
    saveData(STORAGE.deliveries,deliveries);
    saveData(STORAGE.users,users.filter(u=>u.id!==id));

    if(session && session.id===id){
        session=null;
        localStorage.removeItem(STORAGE.session);
    }
    navigate("manager-clients");
    toast("Conta do cliente eliminada.");
}

function getDeletedInvoices(){
    const settings=getData(STORAGE.settings,{});
    return Array.isArray(settings.deletedInvoices)?settings.deletedInvoices:[];
}

function managerInvoices(){
    const deleted=getDeletedInvoices();
    const deliveries=getData(STORAGE.deliveries).filter(d=>d.status==="completed" && !deleted.includes(d.id));
    const total=deliveries.reduce((s,d)=>s+Number(d.price||0),0);

    return `
        <div class="page-header">
            <div><h1>Faturas</h1><p>Documentos completos das entregas concluídas.</p></div>
            <div class="actions"><span class="badge badge-blue">${deliveries.length} fatura(s)</span><span class="badge badge-green">${money(total)}</span></div>
        </div>

        <div class="panel">
            <div class="panel-header"><h3>Registo de faturas</h3><span class="badge badge-blue">Entrega concluída</span></div>
            <div class="panel-body">
                <div class="table-wrap"><table><thead><tr><th>Fatura</th><th>Cliente</th><th>Origem → Destino</th><th>Pagamento</th><th>Valor</th><th>Data</th><th>Ações</th></tr></thead><tbody>
                ${deliveries.length?deliveries.map(d=>`<tr>
                    <td><strong>FAT-${d.id.replace("ENT-","")}</strong><br><small>${d.id}</small></td>
                    <td><strong>${esc(d.clientName||"—")}</strong><br><small>${esc(d.clientPhone||"Sem telefone")}</small></td>
                    <td>${esc(d.pickup?.zone||"—")} → ${esc(d.destination?.zone||"—")}</td>
                    <td>${d.paymentStatus==="confirmed"?'<span class="badge badge-green">Confirmado</span>':'<span class="badge badge-orange">Pendente</span>'}</td>
                    <td><strong>${money(d.price)}</strong></td>
                    <td>${formatDate(d.updatedAt||d.createdAt)}</td>
                    <td><div class="invoice-actions"><button class="btn btn-secondary" onclick="viewInvoice('${d.id}')">Abrir</button><button class="btn btn-danger" onclick="deleteInvoice('${d.id}')">Eliminar</button></div></td>
                </tr>`).join(""):`<tr><td colspan="7" class="empty">Nenhuma fatura disponível.</td></tr>`}
                </tbody></table></div>
            </div>
        </div>
    `;
}

function deleteInvoice(id){
    const d=getData(STORAGE.deliveries).find(x=>x.id===id);
    if(!d) return;
    if(!confirm(`Eliminar a fatura FAT-${id.replace("ENT-","")}? A entrega continuará no histórico.`)) return;
    const settings=getData(STORAGE.settings,{});
    if(!Array.isArray(settings.deletedInvoices)) settings.deletedInvoices=[];
    if(!settings.deletedInvoices.includes(id)) settings.deletedInvoices.push(id);
    saveData(STORAGE.settings,settings);
    navigate("manager-invoices");
    toast("Fatura eliminada da lista.");
}

function managerSecurity(){
    return accountSecurity();
}

function accountSecurity(){
    const users=getData(STORAGE.users,[]);
    const settings=getData(STORAGE.settings,{});
    const isManager=session?.role==="manager";
    const user=isManager?null:users.find(u=>u.id===session.id);
    const auth=isManager?(settings.managerAuth||{username:"WAYAMY",password:"123456",phone:""}):user;
    const roleLabel=isManager?"Gestor":(session?.role==="driver"?"Motoboy":"Cliente");
    return `
      <div class="page-header"><div><h1>Segurança da conta</h1><p>Altere apenas os seus próprios dados de acesso.</p></div></div>
      <div class="panel">
        <div class="panel-header"><h3>🔐 Dados de acesso — ${roleLabel}</h3></div>
        <div class="panel-body">
          ${!isManager?`<div class="field"><label>Nome</label><input id="securityName" value="${escAttr(user?.name||"")}"></div>`:""}
          <div class="form-grid">
            <div class="field"><label>${isManager?"Utilizador de início de sessão":"Telefone de início de sessão"}</label><input id="securityLogin" value="${escAttr(isManager?(auth?.username||""):(user?.phone||""))}"></div>
            ${!isManager?`<div class="field"><label>Email</label><input id="securityEmail" type="email" value="${escAttr(user?.email||"")}"></div>`:`<div class="field"><label>Telefone de segurança</label><input id="securityPhone" value="${escAttr(auth?.phone||"")}"></div>`}
            <div class="field"><label>Nova palavra-passe</label><input id="securityPassword" type="password" autocomplete="new-password" placeholder="Deixe vazio para manter"></div>
            <div class="field"><label>Confirmar palavra-passe</label><input id="securityPassword2" type="password" autocomplete="new-password" placeholder="Repita a nova palavra-passe"></div>
          </div>
          <p class="security-note">A palavra-passe atual nunca é mostrada. Só pode ser substituída pelo próprio utilizador.</p>
          <button class="btn btn-primary" onclick="saveAccountSecurity()">💾 Guardar alterações</button>
        </div>
      </div>`;
}

function saveAccountSecurity(){
    const users=getData(STORAGE.users,[]);
    const settings=getData(STORAGE.settings,{});
    const isManager=session?.role==="manager";
    const login=(document.getElementById("securityLogin")?.value||"").trim();
    const pass=document.getElementById("securityPassword")?.value||"";
    const pass2=document.getElementById("securityPassword2")?.value||"";
    if(!login){toast("Informe o dado de login.");return;}
    if(pass && pass!==pass2){toast("As palavras-passe não coincidem.");return;}
    if(pass && pass.length<6){toast("A palavra-passe deve ter pelo menos 6 caracteres.");return;}
    if(isManager){
        settings.managerAuth=settings.managerAuth||{username:"WAYAMY",password:"123456",phone:""};
        settings.managerAuth.username=login;
        settings.managerAuth.phone=(document.getElementById("securityPhone")?.value||"").trim();
        if(pass) settings.managerAuth.password=pass;
        saveData(STORAGE.settings,settings);
        toast("Dados de segurança do Gestor atualizados.");
    }else{
        const u=users.find(x=>x.id===session.id);
        if(!u){toast("Conta não encontrada.");return;}
        u.name=(document.getElementById("securityName")?.value||u.name).trim();
        u.phone=login;
        u.email=(document.getElementById("securityEmail")?.value||"").trim();
        if(pass) u.password=pass;
        saveData(STORAGE.users,users);
        session={...u};
        localStorage.setItem(STORAGE.session,JSON.stringify(session));
        document.getElementById("sidebarUserName").textContent=session.name;
        document.getElementById("sidebarUserPhone").textContent=session.phone;
        toast("Dados de segurança da conta atualizados.");
    }
    renderPage(session.role+"-security");
}

/* =========================================================
   PREÇO DA ROTA
========================================================= */

function initRoutePricePreview(){

    const origin=document.getElementById("pickupZone");
    const destination=document.getElementById("destinationZone");

    if(!origin || !destination) return;

    function update(){

        const routes=getData(STORAGE.routes);

        const route=routes.find(r=>
            r.active &&
            r.origin===origin.value &&
            r.destination===destination.value
        );

        const box=document.getElementById("pricePreview");

        if(!origin.value || !destination.value){

            box.innerHTML=`
                <span>Preço da rota</span>
                <strong>Selecione origem e destino</strong>
            `;

            return;
        }

        if(!route){

            box.innerHTML=`
                <span>Preço da rota</span>
                <strong style="color:#D64545">
                    Rota sem preço definido
                </strong>
                <small>
                    Aguarde a confirmação do Gestor.
                </small>
            `;

            return;
        }

        box.innerHTML=`
            <span>Preço da rota</span>
            <strong>${money(route.price)}</strong>
        `;

    }

    origin.addEventListener("change",update);
    destination.addEventListener("change",update);

}


/* =========================================================
   CRIAR ENTREGA
========================================================= */

function createDelivery(event){

    event.preventDefault();

    const routes=getData(STORAGE.routes);

    const origin=document.getElementById("pickupZone").value;
    const destination=document.getElementById("destinationZone").value;

    const route=routes.find(r=>
        r.active &&
        r.origin===origin &&
        r.destination===destination
    );

    if(!route){

        toast(
            "Esta rota ainda não possui preço definido."
        );

        return;
    }

    const settings=getData(STORAGE.settings);

    const delivery={

        id:"ENT-"+Date.now(),

        clientId:session.id,
        clientName:session.name,
        clientPhone:session.phone,

        clientLocality:
            document.getElementById("clientLocality").value,

        pickup:{

            zone:origin,

            name:
                document.getElementById("pickupName").value,

            phone:
                document.getElementById("pickupPhone").value,

            reference:
                document.getElementById("pickupReference").value,

            address:
                document.getElementById("pickupReference").value,

            notes:
                document.getElementById("pickupNotes").value

        },

        destination:{

            zone:destination,

            name:
                document.getElementById("destinationName").value,

            phone:
                document.getElementById("destinationPhone").value,

            reference:
                document.getElementById("destinationReference").value,

            address:
                document.getElementById("destinationReference").value,

            notes:
                document.getElementById("destinationNotes").value

        },

        package:{

            type:
                document.getElementById("packageType").value,

            description:
                document.getElementById("packageDescription").value,

            notes:
                document.getElementById("packageNotes").value

        },

        price:route.price,

        paymentMethod:settings.paymentMethod,

        paymentStatus:"pending",

        paymentProof:{
            fileName:"",
            fileType:"",
            dataUrl:"",
            uploadedAt:""
        },

        status:"pending",

        driverId:null,
        driverName:null,

        contact:{

            pickupCalled:false,
            pickupConfirmed:false,
            pickedUp:false,

            recipientCalled:false,
            recipientConfirmed:false,

            delivered:false

        },

        createdAt:new Date().toISOString(),
        updatedAt:new Date().toISOString(),

        history:[
            {
                action:"Entrega criada",
                date:new Date().toISOString()
            }
        ]

    };

    const deliveries=getData(STORAGE.deliveries);

    deliveries.unshift(delivery);

    saveData(STORAGE.deliveries,deliveries);

    addNotification(
        "manager",
        "Nova entrega",
        `Nova entrega ${delivery.id} criada por ${session.name}.`
    );

    // Abrir o WhatsApp configurado pelo Gestor com o pedido já preenchido.
    if(settings.orderWhatsapp){
        const orderText = [
            "WAYAMY ENTREGAS - NOVO PEDIDO",
            "",
            "Pedido: "+delivery.id,
            "Cliente: "+delivery.clientName,
            "Telefone: "+delivery.clientPhone,
            "Localidade: "+delivery.clientLocality,
            "",
            "RECOLHA",
            "Zona: "+delivery.pickup.zone,
            "Nome: "+delivery.pickup.name,
            "Telefone: "+delivery.pickup.phone,
            "Endereço/Referência: "+delivery.pickup.reference,
            "",
            "DESTINO",
            "Zona: "+delivery.destination.zone,
            "Destinatário: "+delivery.destination.name,
            "Telefone: "+delivery.destination.phone,
            "Endereço/Referência: "+delivery.destination.reference,
            "",
            "PACOTE",
            "Tipo: "+delivery.package.type,
            "Descrição: "+delivery.package.description,
            "",
            "VALOR: "+money(delivery.price),
            "Pagamento: "+(delivery.paymentMethod==="iban"?"IBAN":"MULTICAIXA Express")
        ].join("\n");

        const whatsappNumber=String(settings.orderWhatsapp).replace(/\D/g,"");
        if(whatsappNumber){
            window.open("https://wa.me/"+whatsappNumber+"?text="+encodeURIComponent(orderText),"_blank");
        }
    }

    toast("Entrega solicitada com sucesso. O WhatsApp de pedidos foi aberto.");

    navigate("client-track");

}

function downloadInvoice(id){
    const d=getData(STORAGE.deliveries).find(x=>x.id===id);
    if(!d){toast("Fatura não encontrada.");return;}
    const lines=[
      "WAYAMY ENTREGAS",
      "FATURA FAT-"+id.replace("ENT-",""),
      "Entrega: "+id,
      "Cliente: "+(d.clientName||"—"),
      "Telefone: "+(d.clientPhone||"—"),
      "Origem: "+(d.pickup?.zone||"—"),
      "Destino: "+(d.destination?.zone||"—"),
      "Motoboy: "+(d.driverName||"—"),
      "Pagamento: "+(d.paymentStatus==="confirmed"?"Confirmado":"Pendente"),
      "Valor: "+money(d.price),
      "Data: "+formatDate(d.updatedAt||d.createdAt)
    ];
    const escPdf=t=>String(t).replaceAll("\\","\\\\").replaceAll("(","\\(").replaceAll(")","\\)");
    let stream="BT\n/F1 12 Tf\n50 800 Td\n";
    lines.forEach((line,i)=>{ if(i) stream+="0 -22 Td\n"; stream+="("+escPdf(line)+") Tj\n"; });
    stream+="ET";
    const objects=["<< /Type /Catalog /Pages 2 0 R >>","<< /Type /Pages /Kids [3 0 R] /Count 1 >>","<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>","<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>","<< /Length "+stream.length+" >>\nstream\n"+stream+"\nendstream"];
    let pdf="%PDF-1.4\n", offsets=[0];
    objects.forEach((obj,i)=>{offsets[i+1]=pdf.length;pdf+=(i+1)+" 0 obj\n"+obj+"\nendobj\n";});

function saveRoute(id){

    const routes=getData(STORAGE.routes);

    const data={

        id:id || "ROT-"+Date.now(),

        origin:
            document.getElementById(
                "routeOrigin"
            ).value.trim(),

        destination:
            document.getElementById(
                "routeDestination"
            ).value.trim(),

        price:Number(
            document.getElementById(
                "routePrice"
            ).value
        ),

        active:id ? (routes.find(r=>r.id===id)?.active!==false) : true

    };

    if(!data.origin || !data.destination || data.price<=0){

        toast("Preencha todos os dados.");
        return;

    }

    if(id){

        const index=routes.findIndex(r=>r.id===id);

        if(index>=0){
            routes[index]=data;
        }

    }else{

        routes.push(data);

    }

    saveData(STORAGE.routes,routes);

    closeModal();

    navigate("manager-routes");

    toast("Rota guardada.");

}


function editRoute(id){

    const route=getData(STORAGE.routes)

    if(route){
        openRouteModal(route);

}


function deleteRoute(id){

    if(!confirm("Eliminar esta rota?")) return;

        .filter(r=>r.id!==id);

/* =========================================================
   CANCELAR
========================================================= */

function cancelDelivery(id){

    if(!confirm("Cancelar esta entrega?")) return;

    const deliveries=getData(STORAGE.deliveries);
    const d=deliveries.find(x=>x.id===id);

    if(!d){
        toast("Entrega não encontrada.");
        return;
    }

    /* Não permitir alterar uma entrega já encerrada. */
    if(["completed","cancelled"].includes(d.status)){
        toast(
            d.status==="cancelled"
            ?"Esta entrega já está cancelada."
            :"Uma entrega concluída não pode ser cancelada."
        );
        return;
    }

    const now=new Date().toISOString();

    d.status="cancelled";
    d.cancelledBy="manager";
    d.cancelledAt=now;
    d.updatedAt=now;

    /* Compatibilidade com entregas antigas que não tinham histórico. */
    if(!Array.isArray(d.history)){
        d.history=[];
    }

    if(!Array.isArray(d.history)){
        d.history=[];
    }

    d.history.push({
        action:"Entrega cancelada pelo Gestor",
        date:now
    });

    saveData(STORAGE.deliveries,deliveries);

    addNotification(
        "client",
        "Entrega cancelada",
        `A entrega ${d.id} foi cancelada pelo Gestor.`
    );

    if(d.driverId){
        addNotification(
            "driver",
            "Entrega cancelada",
            `A entrega ${d.id} foi cancelada pelo Gestor.`
        );
    }

    navigate("manager-deliveries");
    toast("Entrega cancelada com sucesso.");

}

function cancelClientDelivery(id){

    if(!confirm("Deseja cancelar esta entrega?")) return;

    const deliveries=getData(STORAGE.deliveries);
    const d=deliveries.find(x=>x.id===id);

    if(!d){
        toast("Entrega não encontrada.");
        return;
    }

    if(["completed","cancelled"].includes(d.status)){
        toast(

        </p>

        `,

        `

        <button class="btn btn-secondary"
            onclick="closeModal()">

        </button>

        <button class="btn btn-primary"
            onclick="savePaymentProof('${id}')">

        </button>

        `

    );

}


function savePaymentProof(id){

    const fileInput=document.getElementById("paymentFile");
    const reference=document.getElementById("paymentReference").value.trim();
    const file=fileInput?.files?.[0];
    const deliveries=getData(STORAGE.deliveries);
    const d=deliveries.find(x=>x.id===id);

    if(!d) return;

    const finish=(dataUrl="")=>{
        if(file){
            d.paymentProof={
                fileName:file.name,
                fileType:file.type,
                dataUrl,
                uploadedAt:new Date().toISOString()
            };
        }

        d.paymentReference=reference;
        d.paymentStatus="pending";
        d.updatedAt=new Date().toISOString();

        if(!Array.isArray(d.history)) d.history=[];
        d.history.push({action:"Comprovativo de pagamento enviado",date:d.updatedAt});

        saveData(STORAGE.deliveries,deliveries);

        addNotification("manager","Comprovativo recebido",`O cliente enviou comprovativo para ${d.id}.`);

        const settings=getData(STORAGE.settings,{});
        if(settings.proofWhatsapp){
            const text=`WAYAMY ENTREGAS - Comprovativo\nEntrega: ${d.id}\nCliente: ${d.clientName}\nValor: ${money(d.price)}\nReferência: ${reference||"Não informada"}`;
            window.open("https://wa.me/"+settings.proofWhatsapp.replace(/\D/g,"")+"?text="+encodeURIComponent(text),"_blank");
        }

        closeModal();
        navigate("client-track");
        toast("Comprovativo registado e enviado para análise.");
    };

    if(file){
        const reader=new FileReader();
        reader.onload=()=>finish(reader.result);
        reader.readAsDataURL(file);
    }else{
        finish("");
    }
}

function confirmPayment(id){

    const deliveries=getData(STORAGE.deliveries);

    const d=deliveries.find(x=>x.id===id);

    if(!d) return;

    if(d.paymentStatus==="confirmed") {
        toast("Este pagamento já está confirmado.");
        return;
    }

    d.paymentStatus="confirmed";

    d.updatedAt=new Date().toISOString();

    if(!Array.isArray(d.history)){
        d.history=[];
    }

    d.history.push({
        action:"Pagamento confirmado pelo Gestor",
        date:new Date().toISOString()
    });

    saveData(STORAGE.deliveries,deliveries);

    addNotification(
        "client",

/* =========================================================

========================================================= */

function saveSettings(){

    const s=getData(STORAGE.settings);

    s.paymentMethod=
        document.getElementById(
            "paymentMethod"
        ).value;

    s.iban={

        holder:
            document.getElementById(
                "ibanHolder"
            ).value,

        bank:
            document.getElementById(
                "ibanBank"
            ).value,

        iban:
            document.getElementById(
                "ibanNumber"
            ).value,

        account:
            document.getElementById(
                "accountNumber"
            ).value,

        instructions:
            document.getElementById(
                "ibanInstructions"
            ).value

    };

    s.multicaixa={

        name:
            document.getElementById(
                "mcxName"
            ).value,

        number:
            document.getElementById(
                "mcxNumber"
            ).value,

        instructions:
            document.getElementById(
                "mcxInstructions"
            ).value

    };

    s.orderWhatsapp=
        document.getElementById(
            "orderWhatsapp"
        ).value.trim().replace(/\D/g,"");

    s.proofWhatsapp=
        document.getElementById(
            "proofWhatsapp"
        ).value.trim().replace(/\D/g,"");

    const rawDriver=document.getElementById("driverPercent")?.value;
    const driverPercent=Number(rawDriver);
    if(!Number.isFinite(driverPercent) || driverPercent<0 || driverPercent>100){
        toast("A percentagem do Motoboy deve estar entre 0% e 100%.");
        return;
    }
    s.driverPercent=Math.round(driverPercent);
    s.companyPercent=100-s.driverPercent;
    const companyInput=document.getElementById("companyPercent");
    if(companyInput) companyInput.value=s.companyPercent;

    s.theme=s.theme==="dark"?"dark":"light";

    saveData(STORAGE.settings,s);
    applyTheme();

    updateManagerStatusPill();

    toast("Definições guardadas.");

}


/* =========================================================
   UTILIZADORES
========================================================= */

function toggleUser(id){

    const users=getData(STORAGE.users);

    const user=users.find(
        u=>u.id===id
    );

    if(!user) return;

    user.active=!user.active;

    saveData(STORAGE.users,users);

    if(user.role==="client"){
        navigate("manager-clients");
    }else{
        navigate("manager-drivers");
    }

    toast(
        user.active
        ?"Conta ativada."
        :"Conta desativada."
    );

}


function toggleDriverOnline(){

    const users=getData(STORAGE.users);

    const user=users.find(
        u=>u.id===session.id
    );

    if(!user) return;

    user.online=!user.online;

    session.online=user.online;

    saveData(STORAGE.users,users);

    localStorage.setItem(
        STORAGE.session,
        JSON.stringify(session)
    );

    renderPage("driver-availability");

    toast(
        user.online
        ?"Agora está ONLINE."
        :"Agora está OFFLINE."
    );

}


/* =========================================================
   PERFIL
========================================================= */

function saveProfile(){

    const users=getData(STORAGE.users);

    const user=users.find(
        u=>u.id===session.id
    );

    if(!user) return;

    user.name=
        document.getElementById(
            "profileName"
        ).value;

    user.phone=
        document.getElementById(
            "profilePhone"
        ).value;

    user.email=

            "profileEmail"
        ).value;

        "sidebarUserPhone"

}


/* =========================================================
   NOTIFICAÇÕES
========================================================= */

function addNotification(role,title,message){

    const list=getData(STORAGE.notifications);

    list.unshift({

        id:"NOT-"+Date.now()+"-"+Math.random(),

        role,

        title,

        message,

        read:false,

        createdAt:new Date().toISOString()

    });

    saveData(STORAGE.notifications,list);

}


function updateNotificationCount(){

    const list=getData(STORAGE.notifications);

    const count=list.filter(n=>
        !n.read &&
        (n.role===session?.role || n.role==="all")
    ).length;

    const element=document.getElementById(
        "notificationCount"
    );

    if(element){
        element.textContent=count;
        element.style.display=count?"flex":"none";
    }

}


function markAllRead(){

    const list=getData(STORAGE.notifications);

    list.forEach(n=>{

        if(
            n.role===session.role ||
            n.role==="all"
        ){
            n.read=true;
        }

    });

    saveData(STORAGE.notifications,list);

    navigate(
        currentRolePage("notifications")
    );

}


function deleteNotification(id){

    const list=getData(STORAGE.notifications)
        .filter(n=>n.id!==id);

    saveData(STORAGE.notifications,list);

    navigate(
        currentRolePage("notifications")
    );

}

/* =========================================================
   MODAL
========================================================= */

function openModal(title,body,footer=""){

    document.getElementById("modalTitle")
        .textContent=title;

    document.getElementById("modalBody")
        .innerHTML=body;

    document.getElementById("modalFooter")
        .innerHTML=footer;

    document.getElementById("modal")
        .classList.add("show");

}


function closeModal(){

    document.getElementById("modal")
        .classList.remove("show");

}


document.getElementById("modal")
    .addEventListener("click",function(e){

        if(e.target===this){
            closeModal();
        }

    });


/* =========================================================
   FILTRO
========================================================= */

function filterDeliveries(type){

    const deliveries=getData(STORAGE.deliveries);

    let filtered=deliveries;

    if(type==="pending"){

        filtered=deliveries.filter(
            d=>d.status==="pending"
        );

    }

    if(type==="completed"){

        filtered=deliveries.filter(
            d=>d.status==="completed"
        );

    }

    if(type==="cancelled"){

        filtered=deliveries.filter(
            d=>d.status==="cancelled"
        );

    }

    const container=
        document.getElementById(
            "managerDeliveryList"
        );

    if(container){

        container.innerHTML=filtered.length
            ?filtered.map(deliveryCardManager).join("")
            :`
                <div class="panel">
                    <div class="panel-body empty">
                        Nenhuma entrega encontrada.
                    </div>
                </div>
            `;

    }

}

/* =========================================================
   HELPERS
========================================================= */

function money(value){

    return Number(value||0).toLocaleString(
        "pt-AO"
    )+" Kz";

}


function esc(value){

    return String(value??"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escAttr(value){

    return esc(value);

}


function formatDate(date){

    if(!date) return "—";

    return new Date(date).toLocaleString(
        "pt-AO",
        {
            dateStyle:"short",
            timeStyle:"short"
        }
    );

}


function statusBadge(status){

    const map={

        pending:["PENDENTE","badge-orange"],

        assigned:["MOTOBOY ATRIBUÍDO","badge-blue"],

        contacting_pickup:["A CONTACTAR RECOLHA","badge-blue"],

        picked_up:["RECOLHA EFETUADA","badge-blue"],

        contacting_recipient:["A CONTACTAR DESTINATÁRIO","badge-blue"],

        ready_delivery:["PRONTA PARA ENTREGA","badge-blue"],

        completed:["CONCLUÍDA","badge-green"],

        cancelled:["CANCELADA","badge-red"]

    };

    const data=
        map[status] ||
        ["PENDENTE","badge-orange"];

    return `
        <span class="badge ${data[1]}">
            ${data[0]}
        </span>
    `;

}


function paymentBadge(status){

    if(status==="confirmed"){

        return `
            <span class="badge badge-green">
                CONFIRMADO
            </span>
        `;

    }

    if(status==="cancelled"){

        return `
            <span class="badge badge-red">
                CANCELADO
            </span>
        `;

    }

    return `
        <span class="badge badge-orange">
            PENDENTE
        </span>
    `;

}


function step(text,done){

    return `
        <div class="step ${done?"done":""}">
            ${done?"✓ ":""}${text}
        </div>
    `;

}


function emptyPage(icon,title,text){

    return `

        <div class="panel">

            <div class="panel-body empty">

                <div style="font-size:40px">
                    ${icon}
                </div>

                <br>

                <h3>${title}</h3>

                <br>

                <p>${text}</p>

            </div>

        </div>

    `;

}


function toast(message){

    const t=document.getElementById("toast");

    t.textContent=message;

    t.classList.add("show");

    setTimeout(()=>{
        t.classList.remove("show");
    },2800);

}
